server {
    # 8080 como el resto de servicios, y por encima de 1024 para no
    # necesitar privilegios.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin resolver, nginx resuelve los nombres de los upstreams UNA SOLA VEZ al
    # cargar la configuracion: si despues se recrea un servicio, su IP cambia y
    # nginx sigue enviando a la antigua. Con `resolver` mas una variable en
    # proxy_pass, vuelve a resolver en cada peticion y la pila aguanta
    # reinicios parciales.
    #
    # El DNS interno de Docker. Este fichero solo se usa en compose: en AWS el
    # frontal se sirve desde S3 y CloudFront, sin nginx por medio.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Sonda propia. El balanceador la usa para decidir si mandar trafico, y no
    # puede ser `/` porque eso devolveria el SPA entero en cada comprobacion.
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"Healthy","service":"frontend"}';
    }

    # Enrutado del lado del cliente: cualquier ruta desconocida devuelve el SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Un unico origen para el navegador; nginx reparte por servicio.
    # Al usar variables hay que pasar $request_uri de forma explicita, porque
    # nginx ya no reescribe la URI automaticamente.
    location /api/rentals {
        set $upstream_rentals rentals-api;
        proxy_pass http://$upstream_rentals:8080$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/vehicles {
        set $upstream_fleet fleet-api;
        proxy_pass http://$upstream_fleet:8080$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/notifications {
        set $upstream_notifications notifications-api;
        proxy_pass http://$upstream_notifications:8080$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/insurance {
        set $upstream_insurances insurances-api;
        proxy_pass http://$upstream_insurances:8080$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/policies {
        set $upstream_policies insurances-api;
        proxy_pass http://$upstream_policies:8080$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/invoices {
        set $upstream_billing billing-api;
        proxy_pass http://$upstream_billing:8080$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/quotes {
        set $upstream_pricing pricing-api;
        proxy_pass http://$upstream_pricing:8080$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /api/pricing {
        set $upstream_pricing_catalog pricing-api;
        proxy_pass http://$upstream_pricing_catalog:8080$request_uri;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }
}
