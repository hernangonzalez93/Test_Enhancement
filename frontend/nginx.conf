server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enrutado del lado del cliente: cualquier ruta desconocida devuelve el SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Un unico origen para el navegador; nginx reparte por servicio.
    location /api/rentals       { proxy_pass http://rentals-api:8080; }
    location /api/vehicles      { proxy_pass http://fleet-api:8080; }
    location /api/notifications { proxy_pass http://notifications-api:8080; }
    location /api/quotes        { proxy_pass http://pricing-api:8080; }
    location /api/pricing       { proxy_pass http://pricing-api:8080; }
}
