name: "Nivel 1: encender o apagar servicios"

# ---------------------------------------------------------------------------
# NIVEL 1 del interruptor: para las tareas, deja la infraestructura en pie.
# ---------------------------------------------------------------------------
# Ahorra el computo (~9 $/mes por tarea) y vuelve en segundos. NO ahorra el
# balanceador, que se factura por hora mientras exista y no se puede poner a
# cero: para eso esta el nivel 2, "Terraform destroy".
#
#   Nivel 1  apagar      ~9 $/mes menos   vuelve en segundos
#   Nivel 2  destruir    todo a cero      vuelve en minutos
#
# Para un descanso de horas o de un dia, nivel 1. Para semanas, nivel 2.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'Que hacer con los servicios'
        required: true
        type: choice
        options:
          - apagar
          - encender

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cambiar:
    name: Cambiar el estado
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    steps:
      - name: Asumir el rol de escritura
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY }}
          aws-region: eu-west-1

      # Este workflow enciende y apaga un servicio que YA EXISTE. Si la
      # infraestructura se destruyo con el nivel 2, no hay nada que encender, y
      # el error de AWS —ServiceNotFoundException— no explica que hacer.
      - name: Comprobar que la infraestructura existe
        run: |
          if ! aws ecs describe-clusters --clusters testenforce                  --query 'clusters[0].status' --output text 2>/dev/null | grep -q ACTIVE; then
            echo "::error::La infraestructura no existe. Seguramente se destruyo con el nivel 2."
            {
              echo "## No hay nada que encender"
              echo
              echo "El cluster \`testenforce\` no existe, asi que este workflow no tiene"
              echo "sobre que actuar. Lo mas probable es que la infraestructura se"
              echo "destruyera con **Nivel 2**."
              echo
              echo "### Como volver"
              echo
              echo "| | Workflow | Tarda |"
              echo "|---|---|---|"
              echo "| 1 | **Terraform apply** | ~4 min |"
              echo "| 2 | **Desplegar servicios** | ~6 min |"
              echo
              echo "El segundo hace falta porque al destruir se borro tambien el"
              echo "registro de imagenes. Y el balanceador volvera con un DNS nuevo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Aplicar
        env:
          ACCION: ${{ inputs.accion }}
        run: |
          if [ "$ACCION" = "encender" ]; then TAREAS=1; else TAREAS=0; fi

          # Kafka primero: los demas lo necesitan para publicar y consumir.
          for servicio in kafka pricing-api fleet-api notifications-api rentals-api; do
            aws ecs update-service \
              --cluster testenforce \
              --service "$servicio" \
              --desired-count "$TAREAS" \
              --no-cli-pager > /dev/null
            echo "$servicio -> $TAREAS tarea(s)"
          done

          aws ecs wait services-stable --cluster testenforce --services kafka pricing-api fleet-api notifications-api rentals-api

          # La base de datos no tiene "cero tareas": se para y se arranca, y es
          # una llamada distinta. Ademas tarda varios minutos en cada sentido,
          # asi que se lanza y no se espera.
          ESTADO=$(aws rds describe-db-instances --db-instance-identifier testenforce                      --query 'DBInstances[0].DBInstanceStatus' --output text 2>/dev/null || echo ausente)
          echo "Base de datos: $ESTADO"

          if [ "$ACCION" = "encender" ] && [ "$ESTADO" = "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier testenforce --no-cli-pager > /dev/null
            echo "Arrancando la base de datos (tarda unos minutos)."
          elif [ "$ACCION" = "apagar" ] && [ "$ESTADO" = "available" ]; then
            aws rds stop-db-instance --db-instance-identifier testenforce --no-cli-pager > /dev/null
            echo "Parando la base de datos."
          fi

      - name: Estado final
        if: always()
        run: |
          {
            echo "## Servicios: ${{ inputs.accion }}"
            echo
            echo '| Servicio | Deseadas | En marcha |'
            echo '|---|---:|---:|'
            aws ecs describe-services --cluster testenforce --services pricing-api \
              --query 'services[].[serviceName,desiredCount,runningCount]' --output text \
              | while read n d r; do echo "| $n | $d | $r |"; done
            echo
            if [ "${{ inputs.accion }}" = "apagar" ]; then
              echo "No se ha destruido nada: el cluster, el balanceador y la definicion"
              echo "de tarea siguen ahi. Para volver, este mismo workflow con **encender**."
              echo
              echo "### Lo que sigue costando"
              echo
              echo "| Recurso | Estado | Sigue costando |"
              echo "|---|---|---|"
              echo "| Tareas | a cero | no |"
              echo "| Base de datos | parada | ~2 \$/mes de almacenamiento |"
              echo "| Balanceador | **encendido** | ~16 \$/mes |"
              echo
              echo "El balanceador no se puede apagar, y una base de datos parada sigue"
              echo "pagando su disco. Para dejarlo a cero de verdad hace falta el"
              echo "**Nivel 2**, que lo destruye todo."
              echo
              echo "> AWS vuelve a encender una base de datos parada **a los 7 dias**."
              echo "> Si vas a estar mas de una semana sin tocarla, usa el nivel 2."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
