name: Desplegar servicios

# Al fusionar a main, si ha cambiado el codigo de los servicios. La
# infraestructura tiene su propio workflow: son ritmos distintos, porque el
# codigo cambia muchas veces al dia y la red casi nunca.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/desplegar.yml'
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  desplegar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Asumir el rol de escritura
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY }}
          aws-region: eu-west-1

      - name: Entrar en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # La etiqueta es el SHA del commit, no "latest". Asi cada version tiene
      # un nombre propio e inmutable: se sabe exactamente que hay corriendo, y
      # volver atras es apuntar a una etiqueta anterior.
      # Se anota a que version habria que volver ANTES de desplegar. Si se
      # apunta despues, ya se ha perdido la referencia.
      - name: Anotar la version actual
        id: anterior
        run: |
          ARN=$(aws ecs describe-services --cluster testenforce --services pricing-api --query 'services[0].taskDefinition' --output text)
          CUANTAS=$(aws ecs describe-services --cluster testenforce --services pricing-api --query 'services[0].desiredCount' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "tareas=$CUANTAS" >> "$GITHUB_OUTPUT"
          echo "Version actual: $ARN (con $CUANTAS tarea/s)"

      - name: Calcular la etiqueta
        id: version
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar la imagen
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          IMAGEN="$REGISTRO/testenforce/pricing-api:$TAG"
          docker build -f src/Pricing/Pricing.Api/Dockerfile -t "$IMAGEN" .
          docker push "$IMAGEN"
          echo "IMAGEN=$IMAGEN" >> "$GITHUB_ENV"

      # Se coge la definicion que ya existe, se le cambia solo la imagen y se
      # registra como revision nueva. Asi el resto de la configuracion —CPU,
      # memoria, logs, sondas— sigue siendo la que describe Terraform, y este
      # workflow decide unicamente QUE VERSION corre.
      - name: Registrar la revision nueva
        id: tarea
        run: |
          aws ecs describe-task-definition \
            --task-definition testenforce-pricing-api \
            --query 'taskDefinition' > actual.json

          python - <<'PY'
          import json
          d = json.load(open('actual.json'))
          for k in ('taskDefinitionArn', 'revision', 'status', 'requiresAttributes',
                    'compatibilities', 'registeredAt', 'registeredBy'):
              d.pop(k, None)
          import os
          d['containerDefinitions'][0]['image'] = os.environ['IMAGEN']
          json.dump(d, open('nueva.json', 'w'))
          PY

          ARN=$(aws ecs register-task-definition --cli-input-json file://nueva.json \
                  --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"
          echo "Registrada: $ARN"

      # desired-count 1 hace las veces de encendido: si el apagado nocturno lo
      # dejo a cero, desplegar vuelve a levantarlo.
      - name: Desplegar
        run: |
          aws ecs update-service \
            --cluster testenforce \
            --service pricing-api \
            --task-definition "${{ steps.tarea.outputs.arn }}" \
            --desired-count 1 \
            --no-cli-pager > /dev/null

          echo "Esperando a que el servicio se estabilice..."
          aws ecs wait services-stable --cluster testenforce --services pricing-api

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Averiguar la direccion del balanceador
        id: balanceador
        run: |
          DNS=$(aws elbv2 describe-load-balancers --names testenforce --query 'LoadBalancers[0].DNSName' --output text)
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"

      # El momento de la verdad. Las mismas pruebas que corren en local contra
      # docker compose, ahora contra AWS: solo cambian las variables de entorno.
      # SMOKE_SERVICES acota a lo que hay desplegado, y el resto se salta en
      # lugar de fallar.
      - name: Pruebas de humo contra el despliegue
        id: humo
        continue-on-error: true
        env:
          SMOKE_SERVICES: pricing
          SMOKE_PRICING_URL: http://${{ steps.balanceador.outputs.dns }}:5102
        run: dotnet test tests/Smoke.Tests

      # Si el humo falla, se vuelve a la version anterior sin esperar a que
      # nadie mire. Es la diferencia entre "desplegar" y "desplegar con red".
      - name: Volver atras si el humo ha fallado
        if: steps.humo.outcome == 'failure'
        run: |
          echo "::error::El humo ha fallado. Volviendo a ${{ steps.anterior.outputs.arn }}"
          aws ecs update-service --cluster testenforce --service pricing-api --task-definition "${{ steps.anterior.outputs.arn }}" --no-cli-pager > /dev/null
          aws ecs wait services-stable --cluster testenforce --services pricing-api
          echo "Revertido."

      - name: Fallar si hubo que volver atras
        if: steps.humo.outcome == 'failure'
        run: |
          {
            echo "## Despliegue revertido"
            echo
            echo "La version \`${{ steps.version.outputs.tag }}\` no paso las pruebas de humo."
            echo "El servicio ha vuelto solo a la version anterior."
            echo
            echo "La imagen sigue en el registro: se puede examinar sin prisa."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Donde ha quedado
        run: |
          {
            echo "## Pricing desplegado y verificado"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.version.outputs.tag }}\` |"
            echo "| Direccion | http://${{ steps.balanceador.outputs.dns }}:5102 |"
            echo "| Humo | pasado |"
            echo
            echo "Se apagara solo esta noche. Para apagarlo antes, el workflow"
            echo "**Nivel 1: encender o apagar servicios**."
          } >> "$GITHUB_STEP_SUMMARY"
