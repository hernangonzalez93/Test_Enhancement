name: Desplegar servicios

# Al fusionar a main, si ha cambiado el codigo de los servicios. La
# infraestructura tiene su propio workflow: son ritmos distintos, porque el
# codigo cambia muchas veces al dia y la red casi nunca.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Directory.*.props'
      - 'global.json'
      - '.github/workflows/desplegar.yml'
  workflow_dispatch:

concurrency:
  group: desplegar
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  CLUSTER: testenforce
  # El orden importa al desplegar: Fleet antes que Rentals, porque Rentals le
  # llama nada mas arrancar para resolver vehiculos.
  SERVICIOS: pricing-api fleet-api rentals-api
  # Los que tienen base de datos y por tanto migraciones que aplicar.
  CON_BASE_DE_DATOS: fleet-api rentals-api

jobs:
  desplegar:
    name: Construir y desplegar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Asumir el rol de escritura
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY }}
          aws-region: eu-west-1

      - name: Entrar en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Fusionar un cambio que toca infra/ Y este workflow dispara los dos a la
      # vez, y este puede adelantarse al Terraform apply que crea los servicios.
      # Paso exactamente eso: al preguntar por la version anterior de Fleet y
      # Rentals todavia no existian, se anoto la cadena "None", y la vuelta
      # atras intento luego desplegar una definicion con ese nombre.
      - name: Esperar a que existan los servicios
        run: |
          for intento in $(seq 1 30); do
            FALTAN=""
            for s in $SERVICIOS; do
              ESTADO=$(aws ecs describe-services --cluster "$CLUSTER" --services "$s" \
                         --query 'services[0].status' --output text 2>/dev/null || echo None)
              [ "$ESTADO" = "ACTIVE" ] || FALTAN="$FALTAN $s"
            done

            if [ -z "$FALTAN" ]; then
              echo "Los servicios existen."
              exit 0
            fi

            echo "Esperando a:$FALTAN (intento $intento/30)"
            sleep 10
          done

          echo "::error::Estos servicios no existen tras 5 minutos:$FALTAN"
          {
            echo "## No se puede desplegar"
            echo
            echo "Faltan servicios en el cluster:\`$FALTAN\`"
            echo
            echo "Si acabas de destruir la infraestructura, lanza primero"
            echo "**Terraform apply** y vuelve a intentarlo."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Calcular la etiqueta
        id: version
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Se anota a que version habria que volver ANTES de tocar nada. Si se
      # apunta despues, ya se ha perdido la referencia.
      - name: Anotar las versiones actuales
        run: |
          for s in $SERVICIOS; do
            ARN=$(aws ecs describe-services --cluster "$CLUSTER" --services "$s" \
                    --query 'services[0].taskDefinition' --output text)
            echo "$s=$ARN" >> versiones-anteriores.txt
            echo "$s -> $ARN"
          done

      - name: Construir y publicar las imagenes
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for s in $SERVICIOS; do
            # De "rentals-api" al Dockerfile: src/Rentals/Rentals.Api/Dockerfile
            NOMBRE=$(echo "${s%-api}" | sed 's/./\U&/')
            RUTA="src/$NOMBRE/$NOMBRE.Api/Dockerfile"

            echo "::group::$s"
            docker build -f "$RUTA" -t "$REGISTRO/testenforce/$s:$TAG" .
            docker push "$REGISTRO/testenforce/$s:$TAG"
            echo "::endgroup::"
          done

      # Se coge la definicion que ya existe, se le cambia solo la imagen y se
      # registra como revision nueva. Asi el resto de la configuracion —CPU,
      # memoria, logs, sondas, secretos— sigue siendo la que describe Terraform,
      # y este workflow decide unicamente QUE VERSION corre.
      - name: Registrar las revisiones nuevas
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          for s in $SERVICIOS; do
            aws ecs describe-task-definition --task-definition "testenforce-$s" \
              --query 'taskDefinition' > actual.json

            IMAGEN="$REGISTRO/testenforce/$s:$TAG" python - <<'PY'
          import json, os
          d = json.load(open('actual.json'))
          for k in ('taskDefinitionArn', 'revision', 'status', 'requiresAttributes',
                    'compatibilities', 'registeredAt', 'registeredBy'):
              d.pop(k, None)
          d['containerDefinitions'][0]['image'] = os.environ['IMAGEN']
          json.dump(d, open('nueva.json', 'w'))
          PY

            ARN=$(aws ecs register-task-definition --cli-input-json file://nueva.json \
                    --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "$s=$ARN" >> versiones-nuevas.txt
            echo "$s -> $ARN"
          done

      # ---------------------------------------------------------------------
      # Las migraciones, ANTES de que arranque ningun servicio
      # ---------------------------------------------------------------------
      # Es la pieza que faltaba de la fase 2. Alli sacamos las migraciones del
      # arranque de la aplicacion y anadimos el modo `migrate`; aqui es donde
      # se usa.
      #
      # La misma imagen que va a servir trafico, invocada con `migrate`, aplica
      # el esquema y termina. Que sea la misma garantiza que la version de EF
      # que migra es exactamente la que despues lee.
      # ---------------------------------------------------------------------
      - name: Aplicar las migraciones
        run: |
          SUBREDES=$(aws ec2 describe-subnets \
            --filters "Name=tag:Name,Values=testenforce-publica-*" \
            --query 'Subnets[].SubnetId' --output text | tr '\t' ',')
          GRUPO=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=testenforce-servicios" \
            --query 'SecurityGroups[0].GroupId' --output text)

          for s in $CON_BASE_DE_DATOS; do
            ARN=$(grep "^$s=" versiones-nuevas.txt | cut -d= -f2-)
            echo "::group::migrando $s"

            TAREA=$(aws ecs run-task \
              --cluster "$CLUSTER" \
              --task-definition "$ARN" \
              --launch-type FARGATE \
              --network-configuration "awsvpcConfiguration={subnets=[$SUBREDES],securityGroups=[$GRUPO],assignPublicIp=ENABLED}" \
              --overrides "{\"containerOverrides\":[{\"name\":\"$s\",\"command\":[\"migrate\"]}]}" \
              --query 'tasks[0].taskArn' --output text)

            aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TAREA"

            CODIGO=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TAREA" \
                       --query 'tasks[0].containers[0].exitCode' --output text)
            RAZON=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TAREA" \
                      --query 'tasks[0].stoppedReason' --output text)

            echo "codigo de salida: $CODIGO ($RAZON)"
            echo "::endgroup::"

            # Una migracion fallida no se ignora: desplegar encima dejaria el
            # esquema y el codigo desincronizados, que es peor que no desplegar.
            if [ "$CODIGO" != "0" ]; then
              echo "::error::La migracion de $s fallo con codigo $CODIGO"
              exit 1
            fi
          done

      - name: Desplegar
        run: |
          for s in $SERVICIOS; do
            ARN=$(grep "^$s=" versiones-nuevas.txt | cut -d= -f2-)
            aws ecs update-service --cluster "$CLUSTER" --service "$s" \
              --task-definition "$ARN" --desired-count 1 --no-cli-pager > /dev/null
            echo "$s desplegado"
          done

          echo "Esperando a que se estabilicen..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICIOS

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Averiguar la direccion del balanceador
        id: balanceador
        run: |
          DNS=$(aws elbv2 describe-load-balancers --names testenforce --query 'LoadBalancers[0].DNSName' --output text)
          echo "dns=$DNS" >> "$GITHUB_OUTPUT"

      # Las mismas pruebas que corren en local contra docker compose, ahora
      # contra AWS: solo cambian las variables de entorno. SMOKE_SERVICES acota
      # a lo desplegado, y el resto se salta en lugar de fallar.
      - name: Pruebas de humo contra el despliegue
        id: humo
        continue-on-error: true
        env:
          SMOKE_SERVICES: pricing,fleet,rentals
          SMOKE_PRICING_URL: http://${{ steps.balanceador.outputs.dns }}:5102
          SMOKE_FLEET_URL: http://${{ steps.balanceador.outputs.dns }}:5103
          SMOKE_RENTALS_URL: http://${{ steps.balanceador.outputs.dns }}:5101
        run: dotnet test tests/Smoke.Tests

      # Si el humo falla, se vuelve a la version anterior sin esperar a que
      # nadie mire. Es la diferencia entre "desplegar" y "desplegar con red".
      #
      # OJO: esto revierte el CODIGO, no el esquema. Una migracion ya aplicada
      # sigue aplicada, y por eso las migraciones tienen que ser compatibles
      # hacia atras: anadir una columna, no renombrarla.
      - name: Volver atras si el humo ha fallado
        if: steps.humo.outcome == 'failure'
        run: |
          echo "::error::El humo ha fallado. Volviendo a las versiones anteriores."
          SIN_ANTERIOR=""

          for s in $SERVICIOS; do
            ARN=$(grep "^$s=" versiones-anteriores.txt | cut -d= -f2-)

            # Un servicio recien creado no tiene version anterior. Se deja como
            # esta en lugar de apagarlo: lo mas probable es que el fallo sea de
            # configuracion y quieras mirarlo en marcha. El workflow queda en
            # rojo y el resumen lo dice, asi que nadie lo confunde con un exito.
            if [ -z "$ARN" ] || [ "$ARN" = "None" ]; then
              echo "$s no tenia version anterior: se deja como esta"
              SIN_ANTERIOR="$SIN_ANTERIOR $s"
              continue
            fi

            aws ecs update-service --cluster "$CLUSTER" --service "$s" \
              --task-definition "$ARN" --no-cli-pager > /dev/null
            echo "$s revertido a $ARN"
          done

          echo "SIN_ANTERIOR=$SIN_ANTERIOR" >> "$GITHUB_ENV"
          aws ecs wait services-stable --cluster "$CLUSTER" --services $SERVICIOS

      - name: Fallar si hubo que volver atras
        if: steps.humo.outcome == 'failure'
        run: |
          {
            echo "## Despliegue revertido"
            echo
            echo "La version \`${{ steps.version.outputs.tag }}\` no paso las pruebas de humo."
            echo "Los servicios han vuelto solos a la version anterior."
            echo
            echo "> Se ha revertido el codigo, **no el esquema**. Una migracion ya"
            echo "> aplicada sigue aplicada."
            if [ -n "$SIN_ANTERIOR" ]; then
              echo
              echo "### Sin version anterior"
              echo
              echo "Estos servicios son nuevos y no habia a donde volver, asi que"
              echo "siguen en marcha con la version que ha fallado:"
              echo
              echo "\`$SIN_ANTERIOR\`"
              echo
              echo "Revisalos a mano antes de volver a desplegar."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Donde ha quedado
        run: |
          {
            echo "## Desplegado y verificado"
            echo
            echo "Version \`${{ steps.version.outputs.tag }}\`"
            echo
            echo "| Servicio | Direccion |"
            echo "|---|---|"
            echo "| Rentals | http://${{ steps.balanceador.outputs.dns }}:5101 |"
            echo "| Pricing | http://${{ steps.balanceador.outputs.dns }}:5102 |"
            echo "| Fleet | http://${{ steps.balanceador.outputs.dns }}:5103 |"
            echo
            echo "Se apagaran solos esta noche."
          } >> "$GITHUB_STEP_SUMMARY"
